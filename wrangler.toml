name = "ai-chat-assistant"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ---------- DEFAULT (local/dev) ----------
# remote = true runs the Worker locally but connects AI and Vectorize to your
# Cloudflare account - neither has a local simulator

[ai]
binding = "AI"
remote = true

[[vectorize]]
binding = "VECTORIZE"
index_name = "rag-documents"
remote = true

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

# ---------- PRODUCTION ----------

[env.production]
name = "ai-chat-assistant-prod"

[env.production.ai]
binding = "AI"
remote = true

[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "rag-documents"
remote = true

[[env.production.durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

# ---------- STAGING ----------

[env.staging]
name = "ai-chat-assistant-staging"

[env.staging.ai]
binding = "AI"
remote = true

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "rag-documents"
remote = true

[[env.staging.durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

[dev]
local_protocol = "http"
